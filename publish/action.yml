name: Publish to the Composer registry
description: Asks andreapalladiokiv/composer-registry to publish a tag of this repository, and waits for the answer.

# In a package's release pipeline:
#
#   on: { push: { tags: ['v*'] } }
#   jobs:
#     publish:
#       runs-on: ubuntu-latest
#       steps:
#         - uses: andreapalladiokiv/composer-registry/publish@main
#           with: { token: ${{ secrets.COMPOSER_REGISTRY_TOKEN }} }
#
# The token only needs Actions: write on the registry: it starts the registry's workflow and nothing
# else. The registry reads the tag itself and decides what it may publish; this action sends no
# package data.

inputs:
  token:
    description: Token that may run workflows in the registry (fine-grained, Actions write)
    required: true
  tag:
    description: Tag to publish
    default: ${{ github.ref_name }}
  repository:
    description: Repository the tag is in
    default: ${{ github.repository }}

runs:
  using: composite
  steps:
    - name: Ask the registry
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REGISTRY: andreapalladiokiv/composer-registry
        SOURCE: ${{ inputs.repository }}
        TAG: ${{ inputs.tag }}
      run: |
        title="publish $SOURCE $TAG"
        since=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        gh workflow run publish.yml -R "$REGISTRY" -f repository="$SOURCE" -f tag="$TAG"

        # The dispatch returns no run; the registry names its run after what it was asked.
        for _ in $(seq 30); do
          id=$(gh run list -R "$REGISTRY" -w publish.yml -e workflow_dispatch -L 20 --json databaseId,displayTitle,createdAt \
            -q "[.[] | select(.displayTitle == \"$title\" and .createdAt >= \"$since\")][0].databaseId")
          [ -n "$id" ] && break
          sleep 2
        done
        [ -n "$id" ] || { echo "::error::the registry did not start a run for $title"; exit 1; }

        echo "registry run: https://github.com/$REGISTRY/actions/runs/$id"
        gh run watch -R "$REGISTRY" "$id" --exit-status --interval 5 > /dev/null \
          || { gh run view -R "$REGISTRY" "$id" --log-failed | tail -20; exit 1; }

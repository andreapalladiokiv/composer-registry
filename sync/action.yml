name: Sync with the Composer registry
description: Asks andreapalladiokiv/composer-registry to fetch this repository's release tags, and waits for the answer.

# In a package's release pipeline:
#
#   on: { push: { tags: ['v*'] } }
#   jobs:
#     registry:
#       runs-on: ubuntu-latest
#       steps:
#         - uses: andreapalladiokiv/composer-registry/sync@main
#           with: { token: ${{ secrets.COMPOSER_REGISTRY_TOKEN }} }
#
# The action names only the repository. The registry lists its tags and reads composer.json at each new
# one itself, with its own read access; the token can do nothing but start the registry's sync.

inputs:
  token:
    description: Token that may run workflows in the registry (Actions write on composer-registry only)
    required: true
  repository:
    description: Repository to sync
    default: ${{ github.repository }}

runs:
  using: composite
  steps:
    - name: Ask the registry
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REGISTRY: andreapalladiokiv/composer-registry
        SOURCE: ${{ inputs.repository }}
      run: |
        title="sync $SOURCE"
        since=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        gh workflow run sync.yml -R "$REGISTRY" -f repository="$SOURCE"

        # The dispatch returns no run; the registry names its run after the repository.
        for _ in $(seq 30); do
          id=$(gh run list -R "$REGISTRY" -w sync.yml -e workflow_dispatch -L 20 --json databaseId,displayTitle,createdAt \
            -q "[.[] | select(.displayTitle == \"$title\" and .createdAt >= \"$since\")][0].databaseId")
          [ -n "$id" ] && break
          sleep 2
        done
        [ -n "$id" ] || { echo "::error::the registry did not start a run for $title"; exit 1; }

        echo "registry run: https://github.com/$REGISTRY/actions/runs/$id"
        gh run watch -R "$REGISTRY" "$id" --exit-status --interval 5 > /dev/null \
          || { gh run view -R "$REGISTRY" "$id" --log-failed | tail -20; exit 1; }

name: sync
run-name: sync ${{ inputs.repository || 'all admitted repositories' }}

# Brings the registry up to date with the release tags of one admitted repository: one the
# composer-registry-demo GitHub App is installed on. A package's release pipeline starts it through the
# `sync` action on a tag; it names only its repository, and the registry reads that repository's tags
# itself. Run without a repository by hand, it goes over every admitted one. bin/sync.php says what it
# skips and refuses.

on:
  workflow_dispatch:
    inputs:
      repository:
        description: owner/repo to sync (empty = every admitted repository)
        default: ''

permissions:
  contents: write

# No concurrency group: GitHub keeps one pending run per group and cancels the one before it, which
# would drop the sync of another repository. Runs race instead, and the push below rebases.

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # A token for every repository of the installation, read-only, one hour.
      - name: Get a read token for the admitted repositories
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.REGISTRY_APP_ID }}
          private-key: ${{ secrets.REGISTRY_APP_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read

      - name: Sync
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          ONLY: ${{ inputs.repository }}
        run: |
          admitted=$(gh api installation/repositories --paginate -q '.repositories[].full_name')
          if [ -n "$ONLY" ]; then
            grep -qxF "$ONLY" <<< "$admitted" || { echo "::error::$ONLY is not admitted: the App is not installed on it"; exit 1; }
            admitted="$ONLY"
          fi
          set +e
          php bin/sync.php $admitted | tee "$RUNNER_TEMP/sync.log"
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_ENV"

      - name: Commit
        run: |
          git config user.name composer-registry
          git config user.email composer-registry@users.noreply.github.com
          git add p2 packages.json
          if ! git diff --cached --quiet; then
            git commit -q -m "Publish $(grep -c '^published ' "$RUNNER_TEMP/sync.log") versions" -m "$(grep '^published ' "$RUNNER_TEMP/sync.log")"
            pushed=
            for attempt in 1 2 3 4 5; do
              git push -q && { pushed=1; break; }
              git fetch -q origin main
              git rebase -q origin/main || { git checkout -q --theirs packages.json 2>/dev/null; php bin/publish.php --index-only && git add packages.json && GIT_EDITOR=true git rebase --continue; }
              sleep $((attempt * 2))
            done
            [ -n "$pushed" ] || exit 1
          fi
          # A refused tag is a warning on the run, and the run is red until someone deals with it.
          [ "$status" = 0 ]

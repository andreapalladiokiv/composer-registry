name: sync
run-name: sync ${{ inputs.repository || 'all admitted repositories' }}

# Brings the registry up to date with the release tags of every admitted repository: those the
# composer-registry-demo GitHub App is installed on. Package repositories run nothing and hold no
# token; a tag `vX.Y.Z` (or `<package>/vX.Y.Z`) in an admitted repository is published by the next
# sync. bin/sync.php says what it skips and refuses.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      repository:
        description: Only this owner/repo (empty = all admitted)
        default: ''

permissions:
  contents: write

# One sync covers everything, so a pending one replaced by a newer one loses nothing.
concurrency:
  group: composer-registry
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # A token for every repository of the installation, read-only, one hour.
      - name: Get a read token for the admitted repositories
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.REGISTRY_APP_ID }}
          private-key: ${{ secrets.REGISTRY_APP_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read

      - name: Sync
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          ONLY: ${{ inputs.repository }}
        run: |
          admitted=$(gh api installation/repositories --paginate -q '.repositories[].full_name')
          if [ -n "$ONLY" ]; then
            grep -qxF "$ONLY" <<< "$admitted" || { echo "::error::$ONLY is not admitted: the App is not installed on it"; exit 1; }
            admitted="$ONLY"
          fi
          set +e
          php bin/sync.php $admitted | tee "$RUNNER_TEMP/sync.log"
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_ENV"

      - name: Commit
        run: |
          git config user.name composer-registry
          git config user.email composer-registry@users.noreply.github.com
          git add p2 packages.json
          if ! git diff --cached --quiet; then
            git commit -q -m "Publish $(grep -c '^published ' "$RUNNER_TEMP/sync.log") versions" -m "$(grep '^published ' "$RUNNER_TEMP/sync.log")"
            git push -q
          fi
          # A refused tag is a warning on the run, and the run is red until someone deals with it.
          [ "$status" = 0 ]

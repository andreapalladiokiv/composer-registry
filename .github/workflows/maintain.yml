name: maintain
run-name: ${{ inputs.operation }} ${{ inputs.package }} ${{ inputs.argument }}

# Changes to what is published, other than publishing. Running it takes write access to this
# repository, which is what deciding about the registry should take. Every run is a commit carrying
# who ran it and why, so the history of p2/ is the registry's audit log.
#
#   withdraw  package=vendor/name  argument=X.Y.Z              take one version out
#   abandon   package=vendor/name  argument=[vendor/other]     mark abandoned, optionally for a replacement
#   unabandon package=vendor/name                              undo abandon
#   transfer  package=vendor/name  argument=owner/repo         the source repository moved or was renamed
#   reindex                                                    rebuild packages.json from p2/

on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [withdraw, abandon, unabandon, transfer, reindex]
        required: true
      package:
        description: vendor/name (not for reindex)
        default: ''
      argument:
        description: version for withdraw, replacement for abandon, owner/repo for transfer
        default: ''
      reason:
        description: Why — goes into the commit
        required: true

permissions:
  contents: write

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check the request
        id: request
        env:
          OPERATION: ${{ inputs.operation }}
          PACKAGE: ${{ inputs.package }}
          ARGUMENT: ${{ inputs.argument }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ "$OPERATION" != reindex ]; then
            [ -f "p2/$PACKAGE.json" ] || { echo "::error::$PACKAGE is not published"; exit 1; }
          fi
          if [ "$OPERATION" = transfer ]; then
            [[ "$ARGUMENT" == "$OWNER"/* ]] || { echo "::error::$ARGUMENT is outside $OWNER, where the App is installed"; exit 1; }
            echo "name=${ARGUMENT#*/}" >> "$GITHUB_OUTPUT"
          fi

      # A transfer must point at a repository that holds the published commits, or every version of the
      # package stops installing. The App reads the target; it has to be installed there anyway, for the
      # package's next release.
      - name: Get a read token for the target repository
        if: inputs.operation == 'transfer'
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.REGISTRY_APP_ID }}
          private-key: ${{ secrets.REGISTRY_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.request.outputs.name }}
          permission-contents: read

      - name: Check the target holds the published commits
        if: inputs.operation == 'transfer'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PACKAGE: ${{ inputs.package }}
          TARGET: ${{ inputs.argument }}
        run: |
          php -r '
            $n = getenv("PACKAGE"); $d = json_decode(file_get_contents("p2/$n.json"), true);
            foreach ($d["packages"][$n] as $v) { if (isset($v["dist"]["reference"])) echo $v["dist"]["reference"], "\n"; }
          ' | sort -u | while read -r sha; do
            gh api "repos/$TARGET/commits/$sha" --silent || { echo "::error::$TARGET does not hold $sha"; exit 1; }
          done

      - name: Apply
        env:
          OPERATION: ${{ inputs.operation }}
          PACKAGE: ${{ inputs.package }}
          ARGUMENT: ${{ inputs.argument }}
        run: |
          case "$OPERATION" in
            withdraw)  php bin/publish.php --withdraw "$PACKAGE" "$ARGUMENT" ;;
            abandon)   php bin/publish.php --abandon "$PACKAGE" ${ARGUMENT:+"$ARGUMENT"} ;;
            unabandon) php bin/publish.php --abandon "$PACKAGE" --undo ;;
            transfer)  php bin/publish.php --transfer "$PACKAGE" "$ARGUMENT" ;;
            reindex)   php bin/publish.php --index-only ;;
          esac

      - name: Commit
        env:
          TITLE: ${{ inputs.operation }} ${{ inputs.package }} ${{ inputs.argument }}
          REASON: ${{ inputs.reason }}
          ACTOR: ${{ github.actor }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git config user.name composer-registry
          git config user.email composer-registry@users.noreply.github.com
          git add p2 packages.json
          git diff --cached --quiet && { echo "nothing changed"; exit 0; }
          git commit -q -m "$(echo $TITLE)" -m "$REASON" -m "Run by $ACTOR: $RUN"
          for attempt in 1 2 3 4 5; do
            git push -q && exit 0
            git fetch -q origin main
            git rebase -q origin/main || { git checkout -q --theirs packages.json 2>/dev/null; php bin/publish.php --index-only && git add packages.json && GIT_EDITOR=true git rebase --continue; }
            sleep $((attempt * 2))
          done
          exit 1

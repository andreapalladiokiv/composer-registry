name: publish
run-name: publish ${{ inputs.repository }} ${{ inputs.tag }}

# Started by the `publish` action from a package's release pipeline. Whatever asked only names a
# repository and a tag. A repository is admitted by its read-only deploy key being here, as the secret
# DEPLOY_KEY_<OWNER>_<REPO>; the registry reads the tag with it and writes p2/ with its own
# GITHUB_TOKEN. Nothing outside this repository can write to it.

on:
  workflow_dispatch:
    inputs:
      repository:
        description: owner/repo the tag is in
        required: true
      tag:
        description: Release tag, vX.Y.Z
        required: true

permissions:
  contents: write

concurrency:
  group: composer-registry
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the registry
        uses: actions/checkout@v5

      - name: Check the request
        id: request
        env:
          SOURCE: ${{ inputs.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::$TAG is not a release tag"; exit 1; }
          # The deploy key of a repository is the secret DEPLOY_KEY_<OWNER>_<REPO>, in upper case.
          echo "key=DEPLOY_KEY_$(tr 'a-z' 'A-Z' <<< "$SOURCE" | tr -c 'A-Z0-9\n' '_')" >> "$GITHUB_OUTPUT"

      - name: Check the repository is admitted
        env:
          SOURCE: ${{ inputs.repository }}
          ADMITTED: ${{ secrets[steps.request.outputs.key] != '' }}
        run: |
          [ "$ADMITTED" = true ] || { echo "::error::$SOURCE is not admitted: the registry has no ${{ steps.request.outputs.key }}"; exit 1; }

      # The registry needs the tag's commit and its composer.json, nothing else: the dist is the source
      # repository's zipball of that commit. One commit, one file, however large the package is.
      - name: Read the tag
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.repository }}
          ref: refs/tags/${{ inputs.tag }}
          ssh-key: ${{ secrets[steps.request.outputs.key] }}
          path: package
          persist-credentials: false
          filter: blob:none
          sparse-checkout: /composer.json
          sparse-checkout-cone-mode: false

      - name: Publish
        env:
          SOURCE: ${{ inputs.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          sha=$(git -C package rev-parse HEAD)
          php bin/publish.php "$SOURCE" "${TAG#v}" "$sha" package/composer.json
          git config user.name composer-registry
          git config user.email composer-registry@users.noreply.github.com
          git add p2 packages.json
          git diff --cached --quiet && { echo "already published"; exit 0; }
          git commit -q -m "Publish $(jq -r .name package/composer.json) ${TAG#v} from $SOURCE"
          git push
